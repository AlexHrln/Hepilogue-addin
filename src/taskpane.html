<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hépilogue – Saisie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/taskpane.css?v=2.0.0">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-line">
      <span class="brand">Hépilogue</span>
      <button id="refresh" class="icon" type="button" title="Relire le classeur" aria-label="Relire le classeur">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3v3.5H9.5"/><path d="M12.6 6.4A5 5 0 1 0 13 9"/></svg>
      </button>
    </div>
    <div class="ctx" title="Opération et mois sélectionnés dans le tableau de bord">
      <span id="ctx-op" class="ctx-op"></span>
      <span id="ctx-mois" class="ctx-mois"></span>
    </div>
    <div id="busy" class="busy" hidden></div>
  </header>
  <nav class="tabs" role="tablist">
    <button type="button" class="tab on" role="tab" data-tab="paiements">Paiements du mois</button>
    <button type="button" class="tab" role="tab" data-tab="referentiel">Référentiel</button>
  </nav>
  <main id="view" class="view"></main>
  <div id="toast" class="toast-root"></div>
  <div id="modal"></div>

  <script src="js/00-config.js?v=2.0.0"></script>
  <script src="js/01-util.js?v=2.0.0"></script>
  <script src="js/02-excel.js?v=2.0.0"></script>
  <script src="js/10-app.js?v=2.0.0"></script>
  <script>
    Office.onReady(function (info) {
      if (info.host === Office.HostType.Excel) Hepi.start();
      else document.getElementById('view').innerHTML = '<p class="empty">Ce complément fonctionne dans Excel.</p>';
    });
  </script>
</body>
</html>
